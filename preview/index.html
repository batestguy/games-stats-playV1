<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Games Statisticians Play · Phone preview</title>
  <link rel="stylesheet" href="preview.css">
  <script defer src="bank.js"></script>
  <script defer src="equations.js"></script>
  <script defer src="author.js"></script>
  <script defer src="game.js"></script>
  <script defer src="preview.js"></script>
</head>
<body class="opening">
  <section id="opening-screen" aria-label="Galton board opening" tabindex="-1" hidden>
    <canvas id="opening-board" width="860" height="720" role="img" aria-label="Galton board with beads, pegs, and collection bins."></canvas>
  </section>

  <header class="topbar">
    <div class="brand">
      <span class="app-icon" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
      <div><span class="brand-name">Games Statisticians Play</span><span class="brand-edition">Volume 1</span></div>
    </div>
    <a class="handoff-link" href="../HANDOFF.md">Project handoff <span aria-hidden="true">↗</span></a>
  </header>

  <main class="workspace">
    <section class="stage" aria-labelledby="preview-title">
      <header class="stage-header">
        <h1 id="preview-title">Phone preview</h1>
        <span id="dimensions" class="dimensions"></span>
      </header>
      <div class="device-area" id="device-area">
        <div class="device-fit" id="device-fit">
          <div class="device" id="device" data-theme="grid" data-icon="histogram">
            <div class="system-bar" aria-hidden="true">
              <span>10:24</span><span class="camera"></span>
              <span class="system-indicators"><i class="signal"></i><i class="battery"></i></span>
            </div>
            <section id="app-screen" class="app-screen" aria-label="Game screen">
              <p>Loading the question bank…</p>
            </section>
            <dialog id="exit-dialog" aria-labelledby="exit-title" aria-describedby="exit-description">
              <form method="dialog">
                <h2 id="exit-title">Leave the game?</h2>
                <p id="exit-description"></p>
                <button class="game-button primary" value="keep" autofocus>Keep playing</button>
                <button class="game-button" id="confirm-exit" value="exit">Exit to home</button>
              </form>
            </dialog>
            <div class="system-nav" aria-hidden="true"><i></i></div>
          </div>
        </div>
      </div>
    </section>

    <aside class="controls" aria-labelledby="controls-title">
      <h2 id="controls-title">Preview controls</h2>
      <div class="control">
        <label for="device-size">Phone size</label>
        <select id="device-size">
          <option value="360,640">Compact · 360 × 640</option>
          <option value="393,780" selected>Standard · 393 × 780</option>
          <option value="430,900">Large · 430 × 900</option>
        </select>
      </div>
      <fieldset class="control">
        <legend>Orientation</legend>
        <div class="segments">
          <label><input name="orientation" value="portrait" type="radio" checked><span>Portrait</span></label>
          <label><input name="orientation" value="landscape" type="radio"><span>Landscape</span></label>
        </div>
      </fieldset>
      <fieldset class="control">
        <legend>Text size</legend>
        <div class="segments">
          <label><input name="text-size" value="1" type="radio" checked><span>100%</span></label>
          <label><input name="text-size" value="1.3" type="radio"><span>130%</span></label>
          <label><input name="text-size" value="1.6" type="radio"><span>160%</span></label>
        </div>
      </fieldset>

      <div class="appearance">
        <fieldset class="control">
          <legend>Background</legend>
          <div class="segments swatches">
            <label><input name="theme" value="grid" type="radio" checked><span><i class="swatch grid"></i>Graph</span></label>
            <label><input name="theme" value="solid" type="radio"><span><i class="swatch solid"></i>Solid</span></label>
            <label><input name="theme" value="paper" type="radio"><span><i class="swatch paper"></i>Paper</span></label>
          </div>
        </fieldset>
        <fieldset class="control">
          <legend>App icon</legend>
          <div class="segments icon-options">
            <label><input name="icon" value="histogram" type="radio" checked><span>
              <i class="app-icon" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></i>Histogram
            </span></label>
            <label><input name="icon" value="sigma" type="radio"><span>
              <i class="app-icon sigma" aria-hidden="true">Σ</i>Sigma
            </span></label>
          </div>
        </fieldset>
      </div>

      <nav class="quick-checks" aria-label="Preview screens">
        <button id="inspect-formula" type="button">Inspect a formula <span aria-hidden="true">↗</span></button>
        <button id="inspect-launcher" type="button">Open launcher preview <span aria-hidden="true">↗</span></button>
        <button id="resume-game" type="button" hidden>Return to game <span aria-hidden="true">↗</span></button>
      </nav>
      <p class="boundary">Browser simulation. Android installation, TalkBack and system behavior require a device test.</p>
    </aside>
  </main>
  <noscript><p>Enable JavaScript to use the phone preview.</p></noscript>
</body>
</html>
